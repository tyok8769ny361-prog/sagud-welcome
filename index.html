<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5eddf"><title>SAGUD 薩谷德｜族語歡迎</title><style>
:root{--ink:#30392b;--paper:#f7f0e5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}body{background:#e6dfd3}.hero{position:relative;min-height:100svh;background:url('assets/background.jpg') center top/100% 100% no-repeat;text-align:center;overflow:hidden}.hero-content{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:clamp(35px,4.1svh,70px)}.brand{width:clamp(180px,34vw,300px);height:auto;max-height:31svh;object-fit:contain}.rule{display:flex;align-items:center;gap:14px;width:180px;margin:22px 0 16px;color:#384838}.rule:before,.rule:after{content:"";height:1px;background:#9d9a87;flex:1}.tagline{font-size:clamp(15px,2.6vw,21px);font-weight:600;letter-spacing:.08em;margin:0;text-shadow:0 1px 4px #fff8}.open{display:flex;align-items:center;gap:11px;margin-top:34px;background:#304538;border:0;color:white;padding:13px 27px;border-radius:50px;font-weight:650;box-shadow:0 4px 16px #1e35251f}.open svg{width:21px;height:21px}.shade{position:fixed;inset:0;background:#171d1761;z-index:4;opacity:0;pointer-events:none;transition:opacity .3s}.shade.on{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:5;bottom:0;left:50%;width:min(100%,620px);height:min(50svh,490px);min-height:420px;max-height:95svh;background:linear-gradient(150deg,#fffaf2,#f6f0e7);border-radius:35px 35px 0 0;box-shadow:0 -15px 50px #1a24172e;transform:translate(-50%,110%);transition:transform .36s cubic-bezier(.2,.8,.2,1),height .3s;display:flex;flex-direction:column;overflow:auto;padding:12px clamp(22px,5vw,38px) max(24px,env(safe-area-inset-bottom))}.sheet.on{transform:translate(-50%,0)}.sheet.full{height:88svh}.handle{width:44px;height:5px;background:#bbb9b3;border-radius:10px;margin:0 auto 20px;flex-shrink:0;touch-action:none}.top{display:flex;justify-content:space-between;align-items:center;color:#797873;font-size:13px}.close{border:0;background:transparent;color:#30332c;padding:0 2px;font-size:30px;line-height:1}.name{font-size:clamp(24px,5vw,34px);text-align:center;margin:25px 0 10px;color:#292d26}.ornament{display:flex;justify-content:center;gap:3px;margin:2px auto 18px}.ornament i{width:10px;height:10px;border:2px solid #a96d43;transform:rotate(45deg)}.ornament i:nth-child(even){border-color:#59684d}.subtitle{text-align:center;margin:0 0 23px;font-size:16px;color:#4d4c45}.player{display:flex;align-items:center;justify-content:center;gap:14px;border:0;background:transparent;color:#354332;font-size:clamp(17px,4vw,23px);font-weight:700;padding:0 0 22px}.playcircle{display:grid;place-items:center;width:57px;height:57px;border-radius:50%;background:#334631;color:white;flex-shrink:0}.playcircle svg{width:25px;height:25px}.wave{display:flex;align-items:center;gap:3px;height:34px;color:#c5bc9b}.wave i{width:3px;background:currentColor;border-radius:6px;height:12px}.wave i:nth-child(2),.wave i:nth-child(6){height:24px}.wave i:nth-child(3),.wave i:nth-child(5){height:17px}.wave i:nth-child(4){height:33px}.playing .wave i{animation:pulse .7s ease-in-out infinite alternate}.playing .wave i:nth-child(2n){animation-delay:.25s}@keyframes pulse{to{transform:scaleY(.35)}}.roman-label{display:flex;gap:13px;align-items:center;justify-content:center;color:#827e72;font-size:13px}.roman-label:before,.roman-label:after{content:"";height:1px;background:#c8c2b6;width:50px}.roman{font-size:clamp(21px,4vw,27px);font-weight:600;text-align:center;overflow-wrap:anywhere;margin:10px 0 20px}.explore{display:flex;align-items:center;justify-content:center;gap:12px;background:transparent;color:#354332;border:1.5px solid #354332;border-radius:40px;padding:14px 15px;font-size:16px;font-weight:650;width:100%;max-width:390px;margin:auto auto 0}.explore svg{width:20px;height:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px;padding-bottom:10px}.grid[hidden]{display:none}.grid button{border:1px solid #d5d1c7;background:#fff9ee;border-radius:12px;padding:12px 8px;text-align:left;color:#344235}.grid button.active{background:#e6e9db;border-color:#425640}.variant{font-size:12px;color:#7b7a72;text-align:center;margin:6px 0 12px}.sheet.full .explore{margin-top:12px}.sheet:focus{outline:none}@media(min-width:700px){.hero{background-size:auto 100%;background-color:#ede5d7}.hero-content{padding-top:40px}}@media(max-height:730px){.hero-content{padding-top:22px}.brand{max-height:25svh}.rule{margin:12px 0}.open{margin-top:20px}.sheet{min-height:380px}.name{margin-top:15px}.subtitle{margin-bottom:13px}.player{padding-bottom:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="hero"><div class="hero-content"><img class="brand" src="assets/logo.svg" alt="SAGUD 薩谷德茗茶"><div class="rule" aria-hidden="true"><svg width="22" height="22" aria-hidden="true" id="_圖層_2" data-name="圖層 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368.06 205.49">

</svg></div><p class="tagline">一罐茶，一聲來自部落的歡迎</p><button class="open" id="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="2" y="13" width="4" height="7" rx="2"/><rect x="18" y="13" width="4" height="7" rx="2"/></svg>聆聽族語歡迎</button></div></main><div class="shade" id="shade"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="族語歡迎語"><div class="handle" id="handle"></div><div class="top"><span id="counter">族語歡迎語 01 / 16</span><button class="close" id="close" aria-label="關閉">×</button></div><h2 class="name" id="name"></h2><div class="ornament" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p class="subtitle" id="subtitle"></p><button class="player" id="play"><span class="playcircle"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 12 7-12 7z"/></svg></span><span id="playText">播放族語歡迎語</span><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button><div class="roman-label">族語羅馬拼音</div><p class="roman" id="roman"></p><button class="explore" id="explore" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span id="exploreText">探索其他 15 個族群</span><span id="arrow">›</span></button><div class="grid" id="grid" hidden></div><p class="variant" id="variant"></p><audio id="audio" preload="none"></audio></section><script>
const $=id=>document.getElementById(id);const sheet=$('sheet'),audio=$('audio');let tribes=[],current=0,expanded=false;function setPlaying(on){$('play').classList.toggle('playing',on);$('playText').textContent=on?'暫停播放':'播放族語歡迎語';$('playIcon').innerHTML=on?'<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>':'<path d="m8 5 12 7-12 7z"/>'}function show(){sheet.classList.add('on');$('shade').classList.add('on')}function close(){audio.pause();setPlaying(false);sheet.classList.remove('on');$('shade').classList.remove('on')}function pick(i,push=true){current=i;let t=tribes[i];$('counter').textContent=`族語歡迎語 ${String(i+1).padStart(2,'0')} / 16`;$('name').textContent=t.name+' '+t.english;$('subtitle').textContent='聽見來自'+t.name+'的歡迎';$('roman').textContent=t.romanization;$('variant').textContent=t.variant;audio.pause();audio.src=t.audio;setPlaying(false);[...$('grid').children].forEach((b,j)=>b.classList.toggle('active',j===i));if(push)history.replaceState(null,'','#'+t.id);show()}function toggleExplore(){expanded=!expanded;sheet.classList.toggle('full',expanded);$('grid').hidden=!expanded;$('exploreText').textContent=expanded?'收合族群列表':'探索其他 15 個族群';$('arrow').textContent=expanded?'⌄':'›';$('explore').setAttribute('aria-expanded',expanded)}$('open').onclick=()=>{if(tribes.length)show()};$('close').onclick=close;$('shade').onclick=close;$('explore').onclick=toggleExplore;$('play').onclick=async()=>{if(audio.paused){try{await audio.play();setPlaying(true)}catch(e){$('playText').textContent='播放失敗，請重試'}}else{audio.pause();setPlaying(false)}};audio.onended=()=>setPlaying(false);audio.onpause=()=>setPlaying(false);let sy=0;$('handle').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});$('handle').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-sy;if(d>60){if(expanded)toggleExplore();else close()}else if(d< -60&&!expanded)toggleExplore()},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('hashchange',()=>{let i=tribes.findIndex(t=>t.id===location.hash.slice(1));if(i>=0)pick(i,false)});fetch('tribes.json').then(r=>r.json()).then(data=>{tribes=data;data.forEach((t,i)=>{let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'　'+t.name;b.onclick=()=>{pick(i);if(expanded)toggleExplore()};$('grid').appendChild(b)});let i=tribes.findIndex(t=>t.id===decodeURIComponent(location.hash.slice(1)));if(i>=0)pick(i,false);else{pick(0,false);close()}}).catch(()=>{$('open').textContent='資料載入失敗，請重新整理'});
</script></body></html>
